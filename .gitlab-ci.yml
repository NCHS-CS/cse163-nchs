stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  LC_ALL: en_US.UTF-8
  course: cse163
  quarter: 25au
  source_path: _build/html

jupyter-book:
  stage: build
  tags:
    - courseweb
  variables:
    BASE_URL: /courses/$course/$quarter
  script:
    - export PATH="/home/gitlab-runner/.local/bin/:$PATH"
    - pip install nodeenv
    - nodeenv -n 22.20.0 node_env
    - source node_env/bin/activate
    - npx jupyter-book build --html
  artifacts:
    paths:
      - $source_path

courseweb:
  stage: deploy
  tags:
    - courseweb
  script:
    - /www/utils/deploycourseweb.sh
  cache: {}
  variables:
    delete: 'yes' # https://yaml.org/type/bool.html
    GIT_STRATEGY: none
  only:
    - main
  dependencies:
    - jupyter-book
